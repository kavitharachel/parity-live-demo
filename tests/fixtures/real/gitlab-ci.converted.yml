stages:
  - build
  - deploy

build:
  stage: build
  script:
    - mkdir -p out && echo "build-output" > out/app.txt
  artifacts:
    paths:
      - out/

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "deploying"

# Equivalent of Jenkins `post { always { ... } }`
cleanup:
  stage: .post
  when: always
  script:
    - echo "cleanup"

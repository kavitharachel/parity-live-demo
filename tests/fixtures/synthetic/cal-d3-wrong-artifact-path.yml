# SYNTHETIC CALIBRATION FIXTURE -- NOT a real file. Hand-written for verifier calibration only.
# CAL-D3: incorrect artifact path (`dist/` instead of `out/`).
stages:
  - build
  - deploy

build:
  stage: build
  script:
    - mkdir -p out && echo "build-output" > out/app.txt
  artifacts:
    paths:
      - dist/

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "deploying"

# Equivalent of Jenkins `post { always { ... } }`
cleanup:
  stage: .post
  when: always
  script:
    - echo "cleanup"
